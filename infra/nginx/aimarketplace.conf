# Nginx на сервере: три поддомена, TLS выпускается certbot'ом.
# Сам сайт остаётся на Vercel — сюда он не заходит.
#
#   auth.aimarketplace.io → Supabase (вход, база, файлы)
#   api.aimarketplace.io  → наш сервер приложений
#   id.aimarketplace.io   → Keycloak (Яндекс, VK)
#
# Панель Supabase Studio наружу НЕ открывается: к ней ходим через SSH-туннель
#   ssh -L 8000:localhost:8000 root@СЕРВЕР
# Открытая панель — самый быстрый способ отдать чужому человеку всю базу.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 443 ssl http2;
  server_name auth.aimarketplace.io;

  ssl_certificate     /etc/letsencrypt/live/auth.aimarketplace.io/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/auth.aimarketplace.io/privkey.pem;

  # Загрузка аватаров идёт через Storage.
  client_max_body_size 25m;

  location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Realtime работает по веб-сокетам.
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
  }
}

server {
  listen 443 ssl http2;
  server_name api.aimarketplace.io;

  ssl_certificate     /etc/letsencrypt/live/api.aimarketplace.io/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.aimarketplace.io/privkey.pem;

  client_max_body_size 25m;

  location / {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Чат работает по веб-сокетам (Socket.IO).
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
  }
}

server {
  listen 443 ssl http2;
  server_name id.aimarketplace.io;

  ssl_certificate     /etc/letsencrypt/live/id.aimarketplace.io/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/id.aimarketplace.io/privkey.pem;

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# Обычный http только для проверки сертификата и перенаправления.
server {
  listen 80;
  server_name auth.aimarketplace.io api.aimarketplace.io id.aimarketplace.io;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}
